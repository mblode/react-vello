[package]
name = "rvello"
version = "0.0.1"
edition = "2021"
authors = ["React Vello <dev@example.com>"]
license = "MIT"
description = "WASM bindings for the React + Vello renderer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["web"]
web = []
# Panic messages cost the formatting machinery that prints them. Opt in when
# you are debugging; release builds abort instead.
debug-panics = ["dep:console_error_panic_hook"]

[dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = "0.3"
skrifa = "0.37"
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4"
vello = { version = "0.6", default-features = false, features = ["wgpu"] }
wgpu = { version = "26.0.1", default-features = false, features = [
  "wgsl",
  "webgpu",
] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[profile.release]
opt-level = 3
# Cargo's defaults here are tuned for compile time, which is the wrong trade for
# a binary that ships to every visitor and runs a per-frame hot loop.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
# wasm-pack defaults to a bare `-O`. Bulk memory matters directly here: it turns
# the frame buffer copy into a single `memory.copy` instruction.
wasm-opt = [
  "-O4",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
]
