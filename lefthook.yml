pre-commit:
  parallel: true
  jobs:
    # `ultracite fix` formats and lints in one pass, and its linter exits 1 when
    # handed nothing it can lint. Keep it to the types oxlint actually reads, or
    # a manifest-only commit fails the hook.
    - name: ultracite
      glob: "*.{js,jsx,ts,tsx}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true
    # oxfmt on its own for the types ultracite would format but never lint.
    - name: oxfmt
      glob: "*.{json,jsonc,css}"
      run: npx oxfmt {staged_files}
      stage_fixed: true
